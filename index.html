<style>
/* системный шрифт, сгруппированный список, синий только акцентом; сайт всегда тёмный */
:root{
  --f:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;
  --f-disp:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI Variable Display','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
  --bg:#141416; --panel:#212124; --press:#2c2c2f; --line:#343438;
  --text:#e6e6eb; --muted:#94949b; --accent:#4b9bff; --chevron:#5a5a5f;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{height:100%; -webkit-text-size-adjust:100%}
body{
  min-height:100%; margin:0; background:var(--bg); color:var(--text);
  font-family:var(--f); -webkit-font-smoothing:antialiased; touch-action:manipulation;
  display:flex; align-items:center; justify-content:center;
  padding:calc(40px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
}
@supports (height:100dvh){ body{min-height:100dvh} }
main{width:100%; max-width:440px}

h1{font-family:var(--f-disp); font-size:34px; font-weight:700; letter-spacing:-.022em; line-height:1.2; margin:0 0 0 16px}
.about{margin:2px 0 0 16px; font-size:15px; color:var(--muted)}

/* один список с отступами, как в «Настройках» */
.list{display:flex; flex-direction:column; margin-top:24px; background:var(--panel); border-radius:14px; overflow:hidden}
.big{position:relative; display:flex; align-items:center; gap:10px; min-height:48px; padding:12px 16px;
  text-decoration:none; color:var(--text); font-size:17px; letter-spacing:-.015em; transition:background .15s}
.big + .big::before{content:''; position:absolute; top:0; left:16px; right:0; height:.5px; background:var(--line)}
.big .t{flex:1; min-width:0}
.big .hd{font-size:15px; letter-spacing:-.01em; color:var(--muted)}
.big::after{content:''; flex:none; width:7px; height:7px; margin:0 3px 0 2px;
  border-right:2px solid var(--chevron); border-top:2px solid var(--chevron); border-radius:1px; transform:rotate(45deg)}
@media (hover:hover){ .big:hover{background:var(--press)} }
/* нажатие видно сразу, без перехода */
.big:active{background:var(--press); transition:none}
.big:focus-visible{outline:2px solid var(--accent); outline-offset:-2px; border-radius:14px}

.meta{margin:14px 0 0 16px; font-size:13px; color:var(--muted)}
.meta a{color:var(--accent); text-decoration:none}
.meta a:hover{opacity:.75}
@media (max-height:620px){ body{align-items:flex-start} }
</style>
</head>
