@font-face{font-family:'Tenor Sans'; font-style:normal; font-weight:400; font-display:swap;
  src:url(fonts/tenor-sans-cyrillic.woff2) format('woff2');
  unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Tenor Sans'; font-style:normal; font-weight:400; font-display:swap;

  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF,U+FFFD}
@font-face{font-family:Onest; font-style:normal; font-weight:100 900; font-display:swap;

@font-face{font-family:Onest; font-style:normal; font-weight:100 900; font-display:swap;

@font-face{font-family:Lora; font-style:normal; font-weight:400 700; font-display:swap;
  src:url(fonts/lora-cyrillic.woff2) format('woff2');
  unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Lora; font-style:normal; font-weight:400 700; font-display:swap;
  src:url(fonts/lora-latin.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF,U+FFFD}

:root{
  --f-disp:'Tenor Sans',system-ui,sans-serif;
  --f-body:Onest,system-ui,sans-serif;
  --f-num:Lora,Georgia,serif;

  color-scheme:dark;
  --bg:#0b0d14; --panel:#151824; --panel2:#1b1f30; --line:#252a3b;
  --text:#e6e9f5; --muted:#8c93ab; --accent:#a6b4f0;
  --accent-soft:rgba(166,180,240,.20);
  --halo:radial-gradient(ellipse 62% 40% at 50% -2%, rgba(166,180,240,.16), transparent 72%);
  --tick:rgba(201,212,234,.62);
  --shadow:0 18px 44px rgba(0,0,0,.5);
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{height:100%; -webkit-text-size-adjust:100%}
body{
  min-height:100%; margin:0; background:var(--bg); color:var(--text);
  font-family:var(--f-body); touch-action:manipulation;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:28px calc(20px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  font-variant-numeric:lining-nums tabular-nums; font-feature-settings:'lnum' 1,'tnum' 1;
}
@supports (height:100dvh){ body{min-height:100dvh} }

/* свет сверху — единственный источник на странице */
body::before{content:""; position:fixed; inset:0; background:var(--halo); pointer-events:none; z-index:0}
main{width:100%; max-width:604px; position:relative; z-index:1}

header{text-align:center; margin:0 0 30px}
h1{font-family:var(--f-disp); font-size:clamp(29px,7.4vw,36px); font-weight:400;
  letter-spacing:.2em; margin:0 0 0 .2em; line-height:1.15}
.tagline{margin:7px 0 0; font-family:var(--f-disp); font-size:10.5px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--muted)}

/* засечки по углам вместо рамки — приём с игрового поля */
.wrap{position:relative; padding:14px}
.wrap::before{content:""; position:absolute; inset:0; pointer-events:none; background:
  linear-gradient(var(--tick),var(--tick)) left top/13px 2px no-repeat,
  linear-gradient(var(--tick),var(--tick)) left top 2px/2px 11px no-repeat,
  linear-gradient(var(--tick),var(--tick)) right top/13px 2px no-repeat,
  linear-gradient(var(--tick),var(--tick)) right top 2px/2px 11px no-repeat,
  linear-gradient(var(--tick),var(--tick)) left bottom/13px 2px no-repeat,
  linear-gradient(var(--tick),var(--tick)) left bottom 2px/2px 11px no-repeat,
  linear-gradient(var(--tick),var(--tick)) right bottom/13px 2px no-repeat,
  linear-gradient(var(--tick),var(--tick)) right bottom 2px/2px 11px no-repeat}

.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
@media (max-width:560px){ .grid{grid-template-columns:repeat(2,1fr)} }

.card{
  position:relative; display:flex; flex-direction:column; gap:9px;
  padding:15px 14px 14px; text-decoration:none; color:var(--text);
  background:var(--panel); border:1px solid var(--line); border-radius:4px;
  transition:border-color .16s, background .16s, color .16s, transform .16s;
}
.card:hover{border-color:var(--accent); color:var(--accent); transform:translateY(-1px)}
.card:active{background:var(--accent-soft)}
.card:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.card .ic{width:24px; height:24px; stroke:currentColor; fill:none;
  stroke-width:1.2; stroke-linecap:square; stroke-linejoin:miter; color:var(--muted);
  transition:color .16s}
.card:hover .ic{color:var(--accent)}
.card b{font-size:13.5px; font-weight:400; letter-spacing:.01em; line-height:1.2}
.card small{font-size:10.5px; color:var(--muted); line-height:1.3}
.card .go{position:absolute; top:13px; right:12px; width:13px; height:13px;
  stroke:currentColor; fill:none; stroke-width:1.2; stroke-linecap:square; stroke-linejoin:miter;
  opacity:0; transform:translate(-3px,3px); transition:opacity .16s, transform .16s}
.card:hover .go, .card:focus-visible .go{opacity:.9; transform:none}

footer{margin-top:26px; text-align:center; font-size:11.5px; color:var(--muted)}
footer .y{font-family:var(--f-num)}
footer a{color:var(--muted); text-decoration:none; border-bottom:1px solid var(--line);
  transition:color .18s, border-color .18s}
footer a:hover{color:var(--accent); border-bottom-color:var(--accent)}

@media (max-width:560px){
  header{margin-bottom:24px}
  .card{padding:14px 12px 13px}
  footer{margin-top:20px}
}
@media (max-height:620px){ body{justify-content:flex-start} }
@media (prefers-reduced-motion:reduce){ *{transition:none !important} }
</style>
</head>
