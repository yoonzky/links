<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap');

/* Холодная ночь: почти чёрная синь, ледяной голубой, свет сверху. Тема одна. */
:root{
  --bg:#0d1119; --line:#252c3d; --line-soft:#1a2130;
  --text:#e4e9f4; --muted:#7f8aa3; --ice:#9ec1f5;
  --halo:radial-gradient(ellipse 64% 44% at 50% 0%, rgba(158,193,245,.14), transparent 70%);
  --glow:rgba(158,193,245,.10);
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{height:100%; -webkit-text-size-adjust:100%}
body{
  min-height:100%; margin:0; background:var(--bg); color:var(--text);
  font-family:'Cormorant Garamond',Georgia,serif; touch-action:manipulation;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:lining-nums;
}
@supports (height:100dvh){ body{min-height:100dvh} }

/* Нимб: свет, падающий сверху. */
body::before{content:""; position:fixed; inset:0; background:var(--halo); pointer-events:none; z-index:0}
main{width:100%; max-width:392px; text-align:center; position:relative; z-index:1}

.mark{
  display:inline-block; font-family:Cinzel,Georgia,serif;
  font-size:clamp(30px,8.5vw,38px); font-weight:500;
  letter-spacing:.22em; margin:0 0 0 .22em; line-height:1.1;
  color:var(--text);
}

.rule{display:flex; align-items:center; justify-content:center; gap:10px; margin:16px 0 32px}
.rule i{display:block; height:1px; width:56px; background:linear-gradient(90deg,transparent,var(--ice)); opacity:.65}
.rule i:last-of-type{background:linear-gradient(90deg,var(--ice),transparent)}
.rule svg{width:11px; height:11px; fill:var(--ice); opacity:.8}


.links{display:flex; flex-direction:column; text-align:left}
.link{
  position:relative; display:flex; align-items:baseline; gap:14px;
  padding:15px 6px 14px; text-decoration:none; color:var(--text);
  border-top:1px solid var(--line-soft);
  font-size:21px; font-weight:400; letter-spacing:.01em;
  transition:color .18s, padding-left .18s;
}
.link:last-child{border-bottom:1px solid var(--line-soft)}
.link .n{
  font-family:Cinzel,Georgia,serif; font-size:11px; font-weight:400; color:var(--ice);
  letter-spacing:.1em; flex:none; width:22px; opacity:.7; transition:opacity .18s;
}
.link .t{flex:1}
.link .go{display:flex; align-items:center; color:var(--muted); opacity:0; transform:translateX(-4px); transition:opacity .18s, transform .18s}
.link .go svg{width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:1.3; stroke-linecap:square; stroke-linejoin:miter}
.link::after{
  content:""; position:absolute; inset:0; z-index:-1;
  background:radial-gradient(ellipse 62% 150% at 16% 50%, var(--glow), transparent 76%);
  opacity:0; transition:opacity .22s;
}
.link:hover, .link:focus-visible{color:var(--ice); padding-left:12px; outline:none}
.link:hover::after, .link:focus-visible::after{opacity:1}
.link:hover .n, .link:focus-visible .n{opacity:1}
.link:hover .go, .link:focus-visible .go{opacity:.8; transform:none}
.link:focus-visible{box-shadow:inset 0 0 0 1px var(--ice)}
.link:active{color:var(--ice)}

footer{margin-top:32px; font-size:14px; color:var(--muted); font-style:italic; font-weight:300}
footer a{color:var(--muted); text-decoration:none; border-bottom:1px solid var(--line); transition:color .18s, border-color .18s}
footer a:hover{color:var(--ice); border-color:var(--ice)}

@media (max-width:480px){
  body{padding:20px calc(18px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left))}
  .link{font-size:20px; padding:16px 4px}
  footer{margin-top:26px}
}
@media (max-height:600px){
  body{justify-content:flex-start}
  footer{margin-top:18px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none !important} }
</style>
</head>
