/* Нимб, тёмная тема. Значения — из js/engine соседнего проекта: DEV/sudoku/css/base.css,
   блок html[data-theme="dark"]. Переключения тем здесь нет: сайт всегда тёмный. */
@font-face{font-family:'Tenor Sans'; font-style:normal; font-weight:400; font-display:swap;
  src:url(fonts/tenor-sans-cyrillic.woff2) format('woff2');
  unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Tenor Sans'; font-style:normal; font-weight:400; font-display:swap;
  src:url(fonts/tenor-sans-latin.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF,U+FFFD}
@font-face{font-family:Onest; font-style:normal; font-weight:100 900; font-display:swap;
  src:url(fonts/onest-cyrillic.woff2) format('woff2');
  unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Onest; font-style:normal; font-weight:100 900; font-display:swap;
  src:url(fonts/onest-latin.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF,U+FFFD}
@font-face{font-family:Lora; font-style:normal; font-weight:400 700; font-display:swap;
  src:url(fonts/lora-cyrillic.woff2) format('woff2');
  unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Lora; font-style:normal; font-weight:400 700; font-display:swap;
  src:url(fonts/lora-latin.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF,U+FFFD}

:root{
  --f-disp:'Tenor Sans',system-ui,sans-serif;
  --f-body:Onest,system-ui,sans-serif;
  --f-num:Lora,Georgia,serif;

  color-scheme:dark;
  --bg:#0b0d14; --panel:#151824; --line:#252a3b;
  --text:#e6e9f5; --muted:#8c93ab; --accent:#a6b4f0;
  --accent-soft:rgba(166,180,240,.20);
  --halo:radial-gradient(ellipse 62% 40% at 50% -2%, rgba(166,180,240,.16), transparent 72%);
  --tick:rgba(201,212,234,.62);
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{height:100%; -webkit-text-size-adjust:100%}
body{
  min-height:100%; margin:0; background:var(--bg); color:var(--text);
  font-family:var(--f-body); touch-action:manipulation;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  font-variant-numeric:lining-nums tabular-nums; font-feature-settings:'lnum' 1,'tnum' 1;
}
@supports (height:100dvh){ body{min-height:100dvh} }

/* свет сверху — единственный источник на странице */
body::before{content:""; position:fixed; inset:0; background:var(--halo); pointer-events:none; z-index:0}
main{width:100%; max-width:392px; position:relative; z-index:1}

header{text-align:center; margin:0 0 26px}
h1{
  font-family:var(--f-disp); font-size:clamp(28px,7.8vw,35px); font-weight:400;
  letter-spacing:.2em; margin:0 0 0 .2em; line-height:1.15; color:var(--text);
}
.tagline{margin:5px 0 0; font-size:13px; color:var(--muted)}

/* засечки по углам вместо рамки — как у игрового поля */
.links{position:relative; display:flex; flex-direction:column; padding:0 10px}
.links::before{
  content:""; position:absolute; inset:-9px -1px; pointer-events:none; background:
    linear-gradient(var(--tick),var(--tick)) left top/13px 2px no-repeat,
    linear-gradient(var(--tick),var(--tick)) left top/2px 13px no-repeat,
    linear-gradient(var(--tick),var(--tick)) right top/13px 2px no-repeat,
    linear-gradient(var(--tick),var(--tick)) right top/2px 13px no-repeat,
    linear-gradient(var(--tick),var(--tick)) left bottom/13px 2px no-repeat,
    linear-gradient(var(--tick),var(--tick)) left bottom/2px 13px no-repeat,
    linear-gradient(var(--tick),var(--tick)) right bottom/13px 2px no-repeat,
    linear-gradient(var(--tick),var(--tick)) right bottom/2px 13px no-repeat;
}
.link{
  display:flex; align-items:center; gap:14px;
  padding:15px 4px 14px; text-decoration:none; color:var(--text);
  border-top:1px solid var(--line);
  font-size:18.5px; font-weight:400; letter-spacing:.01em;
  transition:color .18s, padding-left .18s;
}
.link:first-child{border-top:0}
.link:last-child{border-bottom:1px solid var(--line)}
.link .n{
  font-family:var(--f-num); font-size:13.5px; font-weight:400; color:var(--muted);
  flex:none; width:26px; transition:color .18s;
}
.link .t{flex:1}
.link .go{display:flex; align-items:center; color:var(--muted);
  opacity:0; transform:translateX(-4px); transition:opacity .18s, transform .18s}
.link .go svg{width:14px; height:14px; stroke:currentColor; fill:none;
  stroke-width:1.2; stroke-linecap:square; stroke-linejoin:miter}
.link:hover, .link:focus-visible{color:var(--accent); padding-left:11px; outline:none}
.link:hover .n, .link:focus-visible .n{color:var(--accent)}
.link:hover .go, .link:focus-visible .go{opacity:.85; transform:none}
.link:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
.link:active{background:var(--accent-soft)}

footer{margin-top:30px; text-align:center; font-size:11.5px; color:var(--muted)}
footer .y{font-family:var(--f-num)}
footer a{color:var(--muted); text-decoration:none; border-bottom:1px solid transparent;
  transition:color .18s, border-color .18s}
footer a:hover{color:var(--accent); border-bottom-color:var(--accent)}

@media (max-width:480px){
  body{padding:20px calc(18px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left))}
  .link{font-size:18px; padding:16px 4px}
  footer{margin-top:24px}
}
@media (max-height:600px){
  body{justify-content:flex-start}
  header{margin-bottom:20px}
  footer{margin-top:18px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none !important} }
</style>
</head>
