@font-face{font-family:'Tenor Sans'; font-style:normal; font-weight:400; font-display:swap;

  unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Tenor Sans'; font-style:normal; font-weight:400; font-display:swap;
  src:url(fonts/tenor-sans-latin.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF,U+FFFD}
@font-face{font-family:Onest; font-style:normal; font-weight:100 900; font-display:swap;
  src:url(fonts/onest-cyrillic.woff2) format('woff2');
  unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Onest; font-style:normal; font-weight:100 900; font-display:swap;
  src:url(fonts/onest-latin.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF,U+FFFD}
@font-face{font-family:Lora; font-style:normal; font-weight:400 700; font-display:swap;
  src:url(fonts/lora-cyrillic.woff2) format('woff2');
  unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Lora; font-style:normal; font-weight:400 700; font-display:swap;
  src:url(fonts/lora-latin.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF,U+FFFD}

:root{
  --f-disp:'Tenor Sans',system-ui,sans-serif;
  --f-body:Onest,system-ui,sans-serif;
  --f-num:Lora,Georgia,serif;

  color-scheme:dark;
  --bg:#0b0d14; --line:#252a3b; --text:#e6e9f5; --muted:#8c93ab; --accent:#a6b4f0;
  --halo:radial-gradient(ellipse 62% 40% at 50% -2%, rgba(166,180,240,.16), transparent 72%);
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{height:100%; -webkit-text-size-adjust:100%}
body{
  min-height:100%; margin:0; background:var(--bg); color:var(--text);
  font-family:var(--f-body); touch-action:manipulation;
  display:flex; align-items:center; justify-content:center;
  padding:32px calc(24px + env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  font-variant-numeric:lining-nums tabular-nums; font-feature-settings:'lnum' 1,'tnum' 1;
}
@supports (height:100dvh){ body{min-height:100dvh} }

/* свет сверху — единственный источник на странице */
body::before{content:""; position:fixed; inset:0; background:var(--halo); pointer-events:none; z-index:0}
main{position:relative; z-index:1; width:100%; max-width:900px;
  display:grid; grid-template-columns:1fr 1fr; gap:0 60px; align-items:center}

h1{font-family:var(--f-disp); font-size:clamp(38px,6vw,62px); font-weight:400;
  letter-spacing:.14em; margin:0; line-height:1.1}
.about{margin:18px 0 0; font-size:13px; color:var(--muted); line-height:1.7}
.meta{margin:26px 0 0; font-size:11.5px; color:var(--muted)}
.meta .y{font-family:var(--f-num)}
.meta a{color:var(--muted); text-decoration:none; border-bottom:1px solid var(--line);
  transition:color .18s, border-color .18s}
.meta a:hover{color:var(--accent); border-bottom-color:var(--accent)}

.list{display:flex; flex-direction:column}
.big{display:flex; align-items:baseline; gap:14px; padding:12px 0;
  border-bottom:1px solid var(--line); text-decoration:none; color:var(--text);
  font-family:var(--f-disp); font-size:26px; letter-spacing:.02em;
  transition:color .18s, padding-left .18s}
.big:first-child{border-top:1px solid var(--line)}
.big .hd{margin-left:auto; font-family:var(--f-body); font-size:11px; color:var(--muted);
  opacity:0; transform:translateX(-6px); transition:opacity .18s, transform .18s}
.big:hover, .big:focus-visible{color:var(--accent); padding-left:12px; outline:none}
.big:hover .hd, .big:focus-visible .hd{opacity:1; transform:none; color:var(--accent)}
.big:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}

@media (max-width:760px){
  body{padding-top:calc(40px + env(safe-area-inset-top))}
  main{grid-template-columns:1fr; gap:26px; max-width:440px}
  h1{font-size:clamp(30px,9vw,38px); letter-spacing:.16em}
  .about{margin-top:12px; font-size:12.5px}
  .meta{margin-top:16px}
  .big{font-size:21px; padding:11px 0}
  .big .hd{opacity:.75; transform:none}
}
@media (max-width:360px){ .big{font-size:19px} }
/* низкий экран: страница прокручивается, а не жмётся */
@media (max-height:620px){ body{align-items:flex-start} }
@media (prefers-reduced-motion:reduce){ *{transition:none !important} }
</style>
