<style>
:root{
  --font:'Segoe UI Variable Text',system-ui,'Segoe UI',sans-serif;
  --font-disp:'Segoe UI Variable Display',system-ui,'Segoe UI',sans-serif;
  --r-tile:20px;
  --bg:#eceef2; --surface:#f7f8fa;
  --text:#272b31; --text-2:#5f6671;
  --accent:#2866cc; --accent-ink:#1f58b3; --tint:rgba(40,102,204,.10); --tint-2:rgba(40,102,204,.2);
  --shadow-1:0 .5px 1px rgba(25,35,55,.05),0 2px 10px rgba(25,35,55,.05);
  --shadow-h:0 1px 2px rgba(25,35,55,.06),0 8px 24px rgba(25,35,55,.1);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#131417; --surface:#1c1e22;
    --text:#d4d7dd; --text-2:#959ba5;
    --accent:#5f9cee; --accent-ink:#86b4f3; --tint:rgba(95,156,238,.13); --tint-2:rgba(95,156,238,.24);
    --shadow-1:0 .5px 1px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.2);
    --shadow-h:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.36);
  }
}
@media (prefers-contrast:more){
  :root{--text-2:#4c525c}
  @media (prefers-color-scheme:dark){ :root{--text-2:#b4b9c2} }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;display:flex;background:var(--bg);color:var(--text);font:15px/1.4 var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
svg{display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{width:100%;max-width:520px;margin:0 auto;padding:calc(44px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left))}
h1{font:700 34px/1.1 var(--font-disp);letter-spacing:-.026em;margin:0 0 20px}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;gap:14px;padding:14px;background:var(--surface);border-radius:var(--r-tile);box-shadow:var(--shadow-1);transition:transform .2s ease-out,box-shadow .2s ease-out;touch-action:manipulation}
.tile:active{transform:scale(.97);transition-duration:.1s}
@media (hover:hover){
  .tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-h)}
  .tile:hover:active{transform:scale(.97)}
}
.ic{width:36px;height:36px;border-radius:50%;background:var(--tint);color:var(--accent);display:grid;place-items:center;flex:none}
.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic .dot{fill:currentColor}
.tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.tx b{font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.25;overflow-wrap:anywhere}
.tx small{font-size:13px;color:var(--text-2)}

.wide{grid-column:1/-1;flex-direction:row;align-items:center}
.wide .ic{width:56px;height:56px}
.wide .ic svg{width:56px;height:56px;stroke:none}
.wide .ic rect{fill:var(--tint-2)}
.wide .ic rect.on{fill:var(--accent)}

footer{display:flex;justify-content:center;gap:14px;margin-top:32px;font-size:13px;color:var(--text-2)}

@media (min-width:720px){
  body{align-items:center}
  main{max-width:680px;padding-top:48px;padding-bottom:48px}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:340px){
  main{padding-left:16px;padding-right:16px}
  .grid{gap:10px}
  .tile{padding:12px}
}
@media (prefers-reduced-motion:reduce){
  .tile,.tile:hover{transform:none;transition:box-shadow .2s}
  .tile:active{transform:none}
}
</style>
</head>

  </nav>
  <footer><span>&copy; 2026 yoonzky</span></footer>

</html>
